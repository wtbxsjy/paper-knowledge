# paper-knowledge credentials — copy to ~/.config/paperkb/credentials.toml
# (or point PAPERKB_CREDENTIALS at another path) and run: chmod 600 <file>
#
# The scripts read this file themselves. Do not paste these values into a chat;
# an agent using this skill must never open or print this file.

[mineru]
# MinerU precision API token (https://mineru.net -> API management).
# Needed only for PDFs that are not available as PMC Open Access XML.
token = ""

[sciverse]
# Sciverse API key — second metadata source. Without it, verification uses
# CrossRef (or arXiv) alone and says so in metadata.json.
api_key = ""

[contact]
# Optional. Sent to CrossRef / NCBI as identification (polite pool) if set.
email = ""
